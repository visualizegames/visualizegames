<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sudoku | Meus Jogos</title>
<meta name="description" content="Jogue Sudoku grátis online — seis níveis de dificuldade, dicas, anotações e cronômetro." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <a href="../../index.html" class="back-link">← Meus Jogos</a>
  <h1 class="game-title">🧩 Sudoku</h1>
  <div class="topbar-spacer"></div>
</header>

<!-- Reserve de anúncio (topo) — ver README para ativar o Google AdSense -->
<div class="ad-slot ad-slot-top" aria-hidden="true"><!-- AD_SLOT_TOP --></div>

<main class="game-wrap">
  <div class="difficulty-bar">
    <span class="difficulty-label">Dificuldade:</span>
    <div class="difficulty-tabs" id="difficulty-tabs">
      <button class="diff-btn" data-difficulty="facil">Fácil</button>
      <button class="diff-btn" data-difficulty="media">Média</button>
      <button class="diff-btn" data-difficulty="dificil">Difícil</button>
      <button class="diff-btn" data-difficulty="especialista">Especialista</button>
      <button class="diff-btn" data-difficulty="mestra">Mestra</button>
      <button class="diff-btn" data-difficulty="extrema">Extrema</button>
    </div>
  </div>

  <div class="board-area">
    <div class="board-container">
      <div class="board" id="board"></div>
      <div class="pause-overlay" id="pause-overlay">
        <span>⏸ Pausado</span>
        <small>Clique para continuar</small>
      </div>
    </div>

    <aside class="sidebar">
      <div class="stat-card">
        <span class="stat-icon">🏆</span>
        <div class="stat-info">
          <span class="stat-value" id="resolved-count">0</span>
          <span class="stat-label">Resolvidos</span>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-card small">
          <span class="stat-label">Erros</span>
          <span class="stat-value" id="errors-count">0/3</span>
        </div>
        <div class="stat-card small">
          <span class="stat-label">Tempo</span>
          <div class="timer-row">
            <span class="stat-value" id="timer">00:00</span>
            <button id="pause-btn" class="icon-btn" title="Pausar">⏸</button>
          </div>
        </div>
      </div>

      <div class="tool-row">
        <button id="undo-btn" class="tool-btn" title="Desfazer">
          <span class="tool-icon">↺</span>
          <span class="tool-text">Desfazer</span>
        </button>
        <button id="erase-btn" class="tool-btn" title="Apagar">
          <span class="tool-icon">⌫</span>
          <span class="tool-text">Apagar</span>
        </button>
        <button id="notes-btn" class="tool-btn" title="Anotações">
          <span class="tool-icon">✎</span>
          <span class="tool-text">Notas</span>
        </button>
        <button id="hint-btn" class="tool-btn" title="Dica">
          <span class="tool-icon">💡</span>
          <span class="tool-text">Dica <em id="hints-count">3</em></span>
        </button>
      </div>

      <div class="number-pad" id="number-pad">
        <button class="num-btn" data-number="1">1</button>
        <button class="num-btn" data-number="2">2</button>
        <button class="num-btn" data-number="3">3</button>
        <button class="num-btn" data-number="4">4</button>
        <button class="num-btn" data-number="5">5</button>
        <button class="num-btn" data-number="6">6</button>
        <button class="num-btn" data-number="7">7</button>
        <button class="num-btn" data-number="8">8</button>
        <button class="num-btn" data-number="9">9</button>
      </div>

      <button id="new-game-btn" class="primary-btn">Novo jogo</button>
    </aside>
  </div>
</main>

<!-- Reserve de anúncio (rodapé) -->
<div class="ad-slot ad-slot-bottom" aria-hidden="true"><!-- AD_SLOT_BOTTOM --></div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <div id="overlay-actions" class="overlay-actions"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
